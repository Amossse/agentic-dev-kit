[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev-kit"
version = "0.8.0"
description = "Local scope, review-size, test-evidence, handoff, and PR policy gates for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Amossse"}]
dependencies = []
keywords = ["ai-agents", "claude-code", "git", "code-review", "agent-handoff", "github-actions", "developer-tools"]

[project.urls]
Homepage = "https://github.com/Amossse/agentic-dev-kit"
Issues = "https://github.com/Amossse/agentic-dev-kit/issues"

[project.scripts]
staged-scope = "agentic_devkit.staged_scope:main"
range-scope = "agentic_devkit.range_scope:main"
test-proof = "agentic_devkit.test_proof:main"
diff-budget = "agentic_devkit.diff_budget:main"
handoff-proof = "agentic_devkit.handoff_proof:main"
policy-gate = "agentic_devkit.policy_gate:main"
pr-event-gate = "agentic_devkit.pr_event_gate:main"
required-check-audit = "agentic_devkit.required_check_audit:main"

[tool.setuptools.packages.find]
include = ["agentic_devkit*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
