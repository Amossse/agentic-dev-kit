[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev-kit"
version = "0.3.0"
description = "Local scope and test-evidence gates for coding-agent changes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Amossse"}]
dependencies = []
keywords = ["ai-agents", "claude-code", "git", "code-review", "developer-tools"]

[project.urls]
Homepage = "https://github.com/Amossse/agentic-dev-kit"
Issues = "https://github.com/Amossse/agentic-dev-kit/issues"

[project.scripts]
staged-scope = "agentic_devkit.staged_scope:main"
range-scope = "agentic_devkit.range_scope:main"
test-proof = "agentic_devkit.test_proof:main"

[tool.setuptools.packages.find]
include = ["agentic_devkit*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
