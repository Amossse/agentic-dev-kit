name: PR Event Gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install released gate
        run: python -m pip install --no-deps git+https://github.com/Amossse/agentic-dev-kit.git@v0.7.0
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check trusted PR event against base policy
        run: pr-event-gate .
