name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff ty build twine
      - run: python -m unittest discover -s tests -v
      - run: python examples/staged_scope_demo.py
      - run: python examples/range_scope_demo.py
      - run: python examples/test_proof_demo.py
      - run: python examples/diff_budget_demo.py
      - run: python examples/handoff_proof_demo.py
      - run: python examples/policy_gate_demo.py
      - run: python examples/pr_event_gate_demo.py
      - run: ruff check . && ruff format --check .
      - run: ty check .
      - run: python -m build && twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: staged-scope --version
      - run: range-scope --version
      - run: test-proof --version
      - run: diff-budget --version
      - run: handoff-proof --version
      - run: policy-gate --version
      - run: pr-event-gate --version
      - run: required-check-audit --version
